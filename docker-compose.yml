# Local PostgreSQL 16 for development.
# Host port defaults to 5433 (5432 is often taken by a locally installed PostgreSQL).
# Override with:  DB_PORT=5432 docker compose up -d   (and run the app with the same DB_PORT)
services:
  postgres:
    image: postgres:16-alpine
    container_name: wallet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - wallet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wallet-pgdata:
